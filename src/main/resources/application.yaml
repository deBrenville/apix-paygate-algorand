quarkus:
  http:
    port: 8080
    # Behind the central Caddy (demo.api-index.org): trust its X-Forwarded-* headers so UriInfo
    # #getBaseUri() reports the PUBLIC https URL, not the internal onramp-a:8080. This is what makes
    # the BSM gw-URLs, the discovery-facade rebasing, and the 402 terms show demo.api-index.org.
    # Safe because the onramp publishes no host ports — only Caddy can reach it on the shared network.
    proxy:
      proxy-address-forwarding: true
      enable-forwarded-host: true
      enable-forwarded-prefix: true
  log:
    level: INFO

onramp:
  app-name: "APIX x402 Onramp"
  # Algorand network + facilitator (pinned during the x402 spike, Task 2)
  network: "algorand-testnet"
  facilitator-url: "https://facilitator.goplausible.xyz"
  # Price asset: official testnet USDC (Circle, ASA 10458941). Mainnet flips to 31566704 via config.
  # (Faucet-free fallback was the agent-minted dUSD 768322928.)
  price-asset-id: "10458941"
  # Shared secret the gateway injects to internal origins (they reject requests without it).
  internal-forward-secret: "internal-s3cr3t"
  # Discovery: the REAL APIX registry. The agent AND the cascade's inner hop discover services here by
  # capability (HATEOAS: root → services-search → endpoint) — no fake facade in production. The demo
  # services must be registered in api-index.org (stage DEVELOPMENT) pointing at this app's /gw routes.
  # Overridable via ONRAMP_REGISTRY_URL (e.g. a staging registry).
  registry-url: "${ONRAMP_REGISTRY_URL:https://api-index.org/}"

  # ── Cascade wallets — flow: Agent A → Service B → Service C ─────────────────
  # Service B (the OUTER service, route "hello"): receives hop 1 from Agent A AND sends hop 2 to
  # Service C. Both roles are the same wallet, so receiver-address defaults to sender-address — you
  # set only ONE address in the .env. To split receiving from the sending wallet later, override
  # ONRAMP_SERVICE_B_RECEIVER_ADDRESS explicitly (then the two intentionally diverge).
  service-b:
    sender-address: "${ONRAMP_SERVICE_B_SENDER_ADDRESS:GVRXJLXF6OJLRIV46CRIXLG3DX3RJYBBAGRKNNYLHWOAHG57GKWHDH6ZAE}"
    receiver-address: "${ONRAMP_SERVICE_B_RECEIVER_ADDRESS:${onramp.service-b.sender-address}}"
    # sender-mnemonic: env only (ONRAMP_SERVICE_B_SENDER_MNEMONIC) — boot-critical, no default;
    # verified at startup against sender-address by ServiceBWalletCheck (fail-fast on mismatch).
  # Service C (the INNER service, route "hello-inner"): receives hop 2 from Service B. It is a
  # pure receiver in the server — signs nothing, so no secret here, only its public address.
  service-c:
    receiver-address: "${ONRAMP_SERVICE_C_RECEIVER_ADDRESS:EO63ZQECPU7IMHTSWOZKH7YBBS73PY72RJKCAMI3LHFT6LGMIR2W5ECIBE}"

  upstreams:
    # INNER demo service ("Hello World A"), route "hello-inner" — the 0-hop gated leaf. It is
    # paid by Service B on hop 2, so its receiver IS Service C. payTo tracks service-c.receiver-address.
    - route: "hello-inner"
      upstream-url: "http://localhost:8080/internal/ledger/screen"
      forward-secret: "internal-s3cr3t"
      pay-to: "${onramp.service-c.receiver-address}"
      price-micros: 10000
      requires-attestation: true
      capability: "demo.hello.inner"
      description: "Inner demo service — returns Hello World A; the 0-hop gated leaf of the cascade"
    # OUTER demo service ("Hello World B"), route "hello" — what Agent A calls and pays (hop 1).
    # It discovers and pays the inner service over x402 (hop 2). payTo tracks service-b.receiver-address.
    - route: "hello"
      upstream-url: "http://localhost:8080/internal/humanity/screen"
      forward-secret: "internal-s3cr3t"
      pay-to: "${onramp.service-b.receiver-address}"
      price-micros: 30000
      requires-attestation: true
      capability: "demo.hello"
      description: "Outer demo service — returns Hello World B; discovers and pays the inner service over x402"
    # Free echo upstream — used by ReverseProxyResourceTest (no payment).
    - route: "echo"
      upstream-url: "http://localhost:8089/echo"
      forward-secret: "s3cr3t"
      price-micros: 0
      capability: "demo.echo"
      description: "Echo test upstream (free)"
    # Paid echo upstream — used by X402GatewayFilterTest (facilitator stubbed).
    - route: "paid-echo"
      upstream-url: "http://localhost:8089/echo"
      forward-secret: "s3cr3t"
      pay-to: "Q2XTPIACCO27OZ7ROPPT5SU5HLAZCELVGEGGSGRIMQBP5TBXHOHZWN6GOY"
      price-micros: 10000
      capability: "demo.paid-echo"
      description: "Paid echo test upstream"
    # Free route that requires the data-processing attestation — used by X402GatewayFilterTest.
    - route: "attested-echo"
      upstream-url: "http://localhost:8089/echo"
      forward-secret: "s3cr3t"
      price-micros: 0
      requires-attestation: true
      capability: "demo.attested-echo"
      description: "Attestation-gated echo test upstream"

# Test profile: run the app on 8080 (so internal upstream URLs + self-base-url match) and
# point the facilitator at the in-test WireMock stub (the live cascade IT overrides it).
"%test":
  quarkus:
    http:
      test-port: 8080
  onramp:
    facilitator-url: "http://localhost:8089"
    # Tests use the self-contained facade (captured registry responses) — the suite stays network-free.
    registry-url: "http://localhost:8080/apix"
