quarkus:
  http:
    port: 8080
  log:
    level: INFO

onramp:
  app-name: "APIX x402 Onramp"
  # Algorand network + facilitator (pinned during the x402 spike, Task 2)
  network: "algorand-testnet"
  facilitator-url: "https://facilitator.goplausible.xyz"
  # Price asset. Faucet-free demo: dUSD (ASA 768322928), minted by the agent. Mainnet flips to
  # USDC (31566704) via config; testnet USDC is 10458941 if a faucet becomes available.
  price-asset-id: "768322928"
  # Shared secret the gateway injects to internal origins (they reject requests without it).
  internal-forward-secret: "internal-s3cr3t"
  upstreams:
    # Upstream A — neutral basic sanctions ledger (all registers, unfiltered).
    - route: "sanctions-basic"
      upstream-url: "http://localhost:8080/internal/ledger/screen"
      forward-secret: "internal-s3cr3t"
      # A's receiver. Faucet-free demo default = the agent's (opted-in) address.
      pay-to: "${ONRAMP_A_PAYTO_ADDRESS:Q2XTPIACCO27OZ7ROPPT5SU5HLAZCELVGEGGSGRIMQBP5TBXHOHZWN6GOY}"
      price-micros: 10000
      requires-attestation: true
      capability: "compliance.sanctions.screen"
      description: "Neutral global sanctions ledger — all registers, match-proof"
    # Upstream B — BSF humanity value layer (chains to A over x402, keeps a margin).
    - route: "humanity"
      upstream-url: "http://localhost:8080/internal/humanity/screen"
      forward-secret: "internal-s3cr3t"
      # B's receiver = B's own (opted-in) address.
      pay-to: "${ONRAMP_B_PAYTO_ADDRESS:GVRXJLXF6OJLRIV46CRIXLG3DX3RJYBBAGRKNNYLHWOAHG57GKWHDH6ZAE}"
      price-micros: 30000
      requires-attestation: true
      capability: "compliance.sanctions.screen.humanity"
      description: "BSF humanity-filtered sanctions screening — chains the neutral ledger"
    # Free echo upstream — used by ReverseProxyResourceTest (no payment).
    - route: "echo"
      upstream-url: "http://localhost:8089/echo"
      forward-secret: "s3cr3t"
      price-micros: 0
      capability: "demo.echo"
      description: "Echo test upstream (free)"
    # Paid echo upstream — used by X402GatewayFilterTest (facilitator stubbed).
    - route: "paid-echo"
      upstream-url: "http://localhost:8089/echo"
      forward-secret: "s3cr3t"
      pay-to: "Q2XTPIACCO27OZ7ROPPT5SU5HLAZCELVGEGGSGRIMQBP5TBXHOHZWN6GOY"
      price-micros: 10000
      capability: "demo.paid-echo"
      description: "Paid echo test upstream"
    # Free route that requires the data-processing attestation — used by X402GatewayFilterTest.
    - route: "attested-echo"
      upstream-url: "http://localhost:8089/echo"
      forward-secret: "s3cr3t"
      price-micros: 0
      requires-attestation: true
      capability: "demo.attested-echo"
      description: "Attestation-gated echo test upstream"

# Test profile: point the facilitator at the in-test WireMock stub.
"%test":
  onramp:
    facilitator-url: "http://localhost:8089"
